[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show slow tests
addopts =
    -v
    --tb=short
    --strict-markers

markers =
    unit: Pure unit tests — no I/O, no real DB
    integration: Integration tests — uses TestClient, mocks external services
    slow: Tests that take > 2 seconds (embeddings, large docs)
