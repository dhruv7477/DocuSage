# SonarQube Cloud analysis. The "SonarQube Cloud" job in
# .github/workflows/ci.yml runs it with the coverage from the unit,
# integration and frontend test jobs.
sonar.projectKey=dhruv7477_DocuSage
sonar.organization=dhruv7477
sonar.projectName=DocuSage

sonar.sources=src,scripts,docker,deploy,.github
sonar.tests=tests,src
sonar.test.inclusions=tests/**,src/**/__tests__/**,src/test/**
# Alembic migrations are generated code.
sonar.exclusions=src/**/__tests__/**,src/test/**,src/db/migrations/versions/**
sonar.python.version=3.12

sonar.python.coverage.reportPaths=coverage-unit.xml,coverage-integration.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# The job fails when the quality gate ("Sonar way", on new code) fails.
sonar.qualitygate.wait=true

# Accepted issues, each with its reason.
sonar.issue.ignore.multicriteria=e1,e2
# S5332 (clear-text protocol): the end-to-end and DAST stacks talk to
# throwaway containers on the runner's own Docker network (mock LLM, Qdrant,
# SeaweedFS), never to the internet.
sonar.issue.ignore.multicriteria.e1.ruleKey=*:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=tests/e2e/**
sonar.issue.ignore.multicriteria.e2.ruleKey=*:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=.github/workflows/**
