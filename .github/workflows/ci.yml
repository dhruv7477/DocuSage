name: CI

on:
  push:
    branches: [master]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; no job here needs more.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  RUFF_VERSION: "0.7.0" # keep in step with requirements-dev.txt
  TORCH_VERSION: "2.15.0" # keep in step with requirements.txt
  DOCKER_IMAGE: docusage-api
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: |
          pip install --only-binary :all: "ruff==${RUFF_VERSION}"

      - name: Ruff lint
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

      - name: Shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" \
            docker/scripts/entrypoint.sh docker/seaweedfs/start.sh \
            scripts/demo-env.sh deploy/oracle/setup-vm.sh deploy/oracle/backup-db.sh \
            tests/e2e/start-stack.sh

      - name: No CRLF line endings committed
        run: |
          crlf=$(git ls-files --eol | awk '$1 ~ /crlf/ {print $NF}')
          if [ -n "$crlf" ]; then echo "Files committed with CRLF:"; echo "$crlf"; exit 1; fi

  # ── Unit Tests ─────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # The CPU wheel avoids downloading several GB of CUDA libraries.
      # Wheels only, so no package's setup script runs during the install.
      - name: Install dependencies
        run: |
          pip install --only-binary :all: "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install --only-binary :all: -r requirements-dev.txt -c constraints.txt

      - name: Run unit tests
        run: pytest tests/unit/ --tb=short -x --cov --cov-report=xml:coverage-unit.xml

      - name: Keep coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 7

  # ── Integration Tests ───────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Credentials match the fallbacks in tests/conftest.py. Test-only values.
    env:
      SECRET_KEY: test-secret-key-that-is-long-enough-32chars
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: docusage_test
      POSTGRES_USER: docusage_user
      POSTGRES_PASSWORD: testpassword
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      STORAGE_BACKEND: s3_compatible
      S3_ENDPOINT: localhost:8333
      S3_ACCESS_KEY: ci-access-key
      S3_SECRET_KEY: ci-secret-key-not-a-real-secret
      S3_BUCKET: docusage-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docusage_test
          POSTGRES_USER: docusage_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docusage_user -d docusage_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      # Real Qdrant for the tenant-isolation tests (no healthcheck tool in the image).
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --only-binary :all: "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install --only-binary :all: -r requirements-dev.txt -c constraints.txt

      # S3 storage for tests/integration/test_storage_s3.py. A step, not a
      # service container, because it needs a custom entrypoint.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -e S3_ACCESS_KEY -e S3_SECRET_KEY \
            -v "$PWD/docker/seaweedfs/start.sh:/start.sh:ro" \
            --entrypoint /bin/sh chrislusf/seaweedfs:4.51 /start.sh
          for i in $(seq 1 60); do curl -sf http://localhost:8333/healthz && exit 0; sleep 1; done
          docker logs seaweedfs; exit 1

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration/ --tb=short -x --cov --cov-report=xml:coverage-integration.xml

      - name: Keep coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 7

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # No lifecycle scripts: nothing here needs them.
      - run: npm ci --ignore-scripts
      - name: Type check
        run: npm run typecheck
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

      - name: Keep coverage for SonarQube Cloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-frontend
          path: coverage/lcov.info
          retention-days: 7

  # ── SonarQube Cloud ─────────────────────────────────────────────
  # Code quality and the "Sonar way" quality gate on new code, with the
  # coverage from the three test jobs. Skips with a notice until the
  # SONAR_TOKEN secret exists (it is never available to forks or Dependabot).
  sonarcloud:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Skip without SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: echo "::notice title=SonarQube Cloud skipped::The SONAR_TOKEN secret is not set, so no analysis ran."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # blame data for "new code"
          persist-credentials: false

      - name: Fetch coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Put the frontend report where sonar-project.properties expects it
        if: env.SONAR_TOKEN != ''
        run: mkdir -p coverage && mv lcov.info coverage/lcov.info

      - name: Analyse
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1

  # ── Docker Build ────────────────────────────────────────────────
  # Native builds on both architectures. arm64 is the demo VM.
  docker-build:
    name: Docker Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [lint, test-unit, test-integration]
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A canary .env proves .dockerignore keeps secrets out of the image.
      - name: Plant a canary .env
        run: echo "CANARY=must-not-reach-the-image" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Image has no secrets or local state
        run: |
          docker run --rm --entrypoint sh "${DOCKER_IMAGE}:${GITHUB_SHA}" -c '
            for p in /src/.env /src/.git /src/.venv /src/node_modules; do
              if [ -e "$p" ]; then echo "unexpected $p in image"; exit 1; fi
            done
            echo "image is clean" '

      - name: torch is the CPU-only build
        run: |
          docker run --rm --entrypoint python "${DOCKER_IMAGE}:${GITHUB_SHA}" \
            -c "import torch, sys; print(torch.__version__); sys.exit(torch.version.cuda is not None)"

  # ── Demo stack end to end ───────────────────────────────────────
  # docker/docker-compose.demo.yml on arm64, behind Caddy on https://localhost,
  # with a mock OpenAI-compatible LLM instead of Groq.
  e2e-demo:
    name: Demo stack end to end (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint]
    env:
      COMPOSE: docker compose -f docker/docker-compose.demo.yml -f tests/e2e/compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the demo stack
        run: tests/e2e/start-stack.sh

      # Caddy signs https://localhost with its own local CA; trust that CA
      # instead of turning certificate checks off.
      - name: Trust Caddy's local CA
        run: $COMPOSE cp caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"

      - name: Only Caddy publishes ports
        run: |
          $COMPOSE ps --format json | python3 -c '
          import json, sys
          rows = [json.loads(line) for line in sys.stdin if line.strip()]
          published = {r["Service"]: sorted({p["PublishedPort"] for p in (r.get("Publishers") or []) if p.get("PublishedPort")}) for r in rows}
          print(published)
          unexpected = {s: p for s, p in published.items() if p and s != "caddy"}
          sys.exit(f"unexpected published ports: {unexpected}" if unexpected else 0)'

      - name: Internal services require credentials
        run: |
          test "$($COMPOSE exec -T api curl -s -o /dev/null -w '%{http_code}' http://qdrant:6333/collections)" = 401
          test "$($COMPOSE exec -T api curl -s -o /dev/null -w '%{http_code}' http://seaweedfs:8333/docusage-docs)" = 403
          $COMPOSE exec -T redis redis-cli ping | grep -q NOAUTH

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sign up, upload, ingest, stream a cited answer
        run: |
          pip install --only-binary :all: httpx==0.27.2
          E2E_CA_CERT="$RUNNER_TEMP/caddy-root.crt" python -W ignore tests/e2e/demo_e2e.py https://localhost

      - name: Database backup can be restored
        run: |
          BACKUP_DIR="$RUNNER_TEMP/backups" deploy/oracle/backup-db.sh
          dump=$(ls "$RUNNER_TEMP"/backups/docusage-*.dump)
          $COMPOSE exec -T postgres pg_restore --list < "$dump" | grep -q "TABLE DATA public users"

      - name: Service logs
        if: failure()
        run: $COMPOSE logs --tail=200

  # ── VM setup script ─────────────────────────────────────────────
  # deploy/oracle/setup-vm.sh on a fresh arm64 Ubuntu runner, twice, to show
  # it works and that a second run changes nothing.
  vm-setup:
    name: VM setup script (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner already has /swapfile, so use a separate file to exercise
      # the creation path.
      - name: First run
        run: |
          sudo SWAP_SIZE=1G SWAP_FILE=/docusage-swapfile deploy/oracle/setup-vm.sh | tee first-run.log
          grep -q "Created a 1G swap file at /docusage-swapfile" first-run.log
      - name: Second run is a no-op
        run: |
          sudo SWAP_SIZE=1G SWAP_FILE=/docusage-swapfile deploy/oracle/setup-vm.sh | tee second-run.log
          grep -q "/docusage-swapfile is already active" second-run.log
          grep -q "INPUT already accepts tcp/443" second-run.log
      - name: Result
        run: |
          swapon --show | grep -q /docusage-swapfile
          grep -q "^/docusage-swapfile none swap" /etc/fstab
          sudo iptables -C INPUT -p tcp -m state --state NEW -m tcp --dport 443 -j ACCEPT
          test -f /etc/cron.d/docusage-backup
