name: CI

on:
  push:
    branches: [master]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  RUFF_VERSION: "0.7.0" # keep in step with requirements.txt
  TORCH_VERSION: "2.4.1" # keep in step with requirements.txt
  DOCKER_IMAGE: docusage-api

jobs:
  # ── Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Ruff lint
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: No CRLF line endings committed
        run: |
          crlf=$(git ls-files --eol | awk '$1 ~ /crlf/ {print $NF}')
          if [ -n "$crlf" ]; then echo "Files committed with CRLF:"; echo "$crlf"; exit 1; fi

  # ── Unit Tests ─────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # The CPU wheel avoids downloading several GB of CUDA libraries.
      - name: Install dependencies
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt

      - name: Run unit tests
        run: pytest tests/unit/ --tb=short -x

  # ── Integration Tests ───────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Credentials match the fallbacks in tests/conftest.py. Test-only values.
    env:
      SECRET_KEY: test-secret-key-that-is-long-enough-32chars
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: privateai_test
      POSTGRES_USER: docusage_user
      POSTGRES_PASSWORD: testpassword
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: privateai_test
          POSTGRES_USER: docusage_user
          POSTGRES_PASSWORD: testpassword
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docusage_user -d privateai_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run integration tests
        run: pytest tests/integration/ --tb=short -x

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  # ── Docker Build ────────────────────────────────────────────────
  # Built natively on arm64, the architecture of the demo VM.
  docker-build:
    name: Docker Build (arm64)
    runs-on: ubuntu-24.04-arm
    needs: [lint, test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4

      # A canary .env proves .dockerignore keeps secrets out of the image.
      - name: Plant a canary .env
        run: echo "CANARY=must-not-reach-the-image" > .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Image has no secrets or local state
        run: |
          docker run --rm --entrypoint sh "${DOCKER_IMAGE}:${GITHUB_SHA}" -c '
            for p in /src/.env /src/.git /src/.venv /src/node_modules; do
              if [ -e "$p" ]; then echo "unexpected $p in image"; exit 1; fi
            done
            echo "image is clean" '

  # ── Docker Push (main branch only) ─────────────────────────────
  docker-push:
    name: Push to Registry
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
