# ════════════════════════════════════════════════════════════════
#  DocuSage — Production Stack
#  docker compose -f docker/docker-compose.prod.yml up -d
#
#  Key differences from dev:
#  - No source bind-mounts (code baked into image)
#  - Resource limits on every service
#  - No debug ports exposed externally (Qdrant gRPC, MinIO console)
#  - Redis with password auth
#  - Nginx reverse proxy (terminates SSL, rate-limits, gzip)
#  - Separate Celery beat for scheduled tasks
#  - All secrets via environment / Docker secrets (never in compose file)
# ════════════════════════════════════════════════════════════════

version: "3.9"

networks:
  privateai-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  ollama_data:
  nginx_certs:

services:

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: docusage-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # ── FastAPI Application ───────────────────────────────────────
  api:
    image: ${DOCKER_IMAGE:-docusage-api}:${IMAGE_TAG:-latest}
    container_name: docusage-api
    expose:
      - "8000"
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    command: >
      uvicorn src.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
      --no-access-log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ── Celery Worker ─────────────────────────────────────────────
  worker:
    image: ${DOCKER_IMAGE:-docusage-api}:${IMAGE_TAG:-latest}
    container_name: docusage-worker
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - api
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G    # More RAM for embedding model
        reservations:
          memory: 1G
    command: >
      celery -A src.workers.celery_app worker
      --loglevel=warning
      --concurrency=2
      --queues=ingestion,default
      --max-tasks-per-child=50

  # ── Celery Beat (scheduled tasks) ─────────────────────────────
  beat:
    image: ${DOCKER_IMAGE:-docusage-api}:${IMAGE_TAG:-latest}
    container_name: docusage-beat
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      POSTGRES_HOST: postgres
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      - redis
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    command: >
      celery -A src.workers.celery_app beat
      --loglevel=warning
      --scheduler=celery.beat:PersistentScheduler

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: docusage-postgres
    expose:
      - "5432"   # Internal only — not exposed on host in prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docusage}
      POSTGRES_USER: ${POSTGRES_USER:-docusage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docusage_user} -d ${POSTGRES_DB:-docusage}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  # ── Qdrant Vector DB ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: docusage-qdrant
    expose:
      - "6333"   # REST — internal only in prod
    volumes:
      - qdrant_data:/qdrant/storage
      - ./docker/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: docusage-redis
    expose:
      - "6379"   # Internal only
    volumes:
      - redis_data:/data
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 1
      --loglevel warning
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible storage) ────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: docusage-minio
    expose:
      - "9000"   # API — internal only
    # 9001 (console) intentionally not exposed in prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ollama (LLM inference) ────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: docusage-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - privateai-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 48G   # LLaMA 3.3 70B needs ~40GB
        reservations:
          memory: 8G
    # GPU: uncomment for NVIDIA
    # runtime: nvidia
    # environment:
    #   NVIDIA_VISIBLE_DEVICES: all
