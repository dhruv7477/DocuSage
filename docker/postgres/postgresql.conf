# PostgreSQL production configuration for DocuSage
# Tuned for a server with 8GB RAM dedicated to Postgres

# ── Connections ───────────────────────────────────────────────
max_connections = 100
# Use PgBouncer if you need more — direct connections are expensive

# ── Memory ───────────────────────────────────────────────────
shared_buffers = 2GB                # 25% of RAM
effective_cache_size = 6GB          # 75% of RAM
work_mem = 20MB                     # Per sort/hash op (100 connections × 20MB = 2GB)
maintenance_work_mem = 512MB        # For VACUUM, CREATE INDEX

# ── WAL / Checkpoints ────────────────────────────────────────
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ── Query Planner ────────────────────────────────────────────
random_page_cost = 1.1              # SSD (use 4.0 for HDD)
effective_io_concurrency = 200      # SSD

# ── Logging (send to stdout for Docker) ──────────────────────
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 1000   # Log queries > 1 second
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ── Autovacuum ───────────────────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# ── Locale ───────────────────────────────────────────────────
timezone = 'UTC'
