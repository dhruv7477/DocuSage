# DocuSage public demo on one small VM (built and tested on linux/arm64).
#
#   scripts/demo-env.sh                                  # once: writes docker/.env
#   docker compose -f docker/docker-compose.demo.yml up -d --build
#
# Only Caddy publishes ports (80 and 443). Postgres, Redis, Qdrant, SeaweedFS
# and the API are reachable only on the compose network, and each one has a
# password or API key. Values come from docker/.env, which Compose reads
# automatically because it sits next to this file. Each service gets only the
# variables it needs.

name: docusage-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY:?run scripts/demo-env.sh first}
  ALLOWED_ORIGINS: '["https://${DEMO_DOMAIN:?run scripts/demo-env.sh first}"]'
  POSTGRES_HOST: postgres
  POSTGRES_DB: docusage
  POSTGRES_USER: docusage
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/demo-env.sh first}
  REDIS_URL: redis://:${REDIS_PASSWORD:?run scripts/demo-env.sh first}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  QDRANT_URL: http://qdrant:6333
  QDRANT_API_KEY: ${QDRANT_API_KEY:?run scripts/demo-env.sh first}
  # A generic S3 client; here it talks to SeaweedFS.
  STORAGE_BACKEND: s3_compatible
  S3_ENDPOINT: seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/demo-env.sh first}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/demo-env.sh first}
  S3_BUCKET: docusage-docs
  S3_SECURE: "false"
  # Hosted LLM (Groq by default) through the OpenAI provider's base URL.
  LLM_PROVIDER: openai
  OPENAI_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
  OPENAI_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in docker/.env}
  OPENAI_MODEL: ${LLM_MODEL:?set LLM_MODEL in docker/.env}
  ROUTER_MODEL: ${ROUTER_MODEL:?set ROUTER_MODEL in docker/.env}
  SUMMARY_MODEL: ${SUMMARY_MODEL:?set SUMMARY_MODEL in docker/.env}
  # Free tiers limit tokens per minute and per day, per model. Retry 429s a
  # few times (the client waits as the server's Retry-After asks), and keep
  # reasoning short: gpt-oss counts its reasoning tokens toward the limits.
  LLM_MAX_RETRIES: "4"
  LLM_TIMEOUT_SECONDS: "120"
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
  # Tokens per reply, reasoning included for gpt-oss. If answers come back
  # empty, the reasoning used them all: raise this (deploy/README.md).
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
  # A whole-document summary is several LLM calls (about 13K tokens for 40
  # chunks), more than Groq's free 8K tokens per minute on its own. Summary
  # requests get a normal cited answer instead. See deploy/README.md
  # to turn them back on with a paid tier.
  DOC_SUMMARY_ENABLED: ${DOC_SUMMARY_ENABLED:-false}
  SUMMARY_MAX_TOTAL_CHUNKS: ${SUMMARY_MAX_TOTAL_CHUNKS:-40}
  EMBEDDING_PROVIDER: bge
  EMBEDDING_DEVICE: cpu
  # Smaller batches for the embedder (worker) and the reranker (API): for
  # 512-token texts a batch of 32 needs about 400 to 480 MB on top of the
  # model, a batch of 8 about 160 to 200 MB, at nearly the same speed.
  EMBEDDING_BATCH_SIZE: "8"
  RERANKER_BATCH_SIZE: "8"
  LOG_LEVEL: INFO
  # Abuse controls for a public URL (see DECISIONS_PENDING.md, D7). Rate-limit
  # counters live in Redis db 3 so restarts and every process share them.
  RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/3
  RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-10}
  QUOTA_MAX_DOCUMENTS: ${QUOTA_MAX_DOCUMENTS:-5}
  QUOTA_MAX_UPLOAD_MB: ${QUOTA_MAX_UPLOAD_MB:-25}
  # Groq's free tier for openai/gpt-oss-120b is about 200K tokens a day, and
  # an answer uses about 3.5K, so the whole demo gets about 50 questions a
  # day. Past the site-wide budget, visitors see "The demo has reached
  # today's limit" instead of an error.
  QUOTA_QUESTIONS_PER_DAY: ${QUOTA_QUESTIONS_PER_DAY:-10}
  DEMO_GLOBAL_QUESTIONS_PER_DAY: ${DEMO_GLOBAL_QUESTIONS_PER_DAY:-50}
  # Sample documents for every new account, nightly wipe of uploads at
  # DEMO_WIPE_HOUR_UTC, and the notice on the sign-up page.
  DEMO_MODE: "true"
  DEMO_WIPE_HOUR_UTC: ${DEMO_WIPE_HOUR_UTC:-3}
  # glibc gives each thread its own malloc arena by default (up to 8 per
  # CPU), and torch and the tokenizers start many threads. Two arenas keep
  # the heap from fragmenting across them.
  MALLOC_ARENA_MAX: "2"

x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: docusage-api:demo
  restart: unless-stopped
  logging: *logging
  volumes:
    # Embedding and reranker weights (about 220 MB), downloaded once.
    - hf-cache:/home/appuser/.cache/huggingface

services:
  caddy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    image: docusage-web:demo
    restart: unless-stopped
    logging: *logging
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?run scripts/demo-env.sh first}
      # Caddy's global "email" option, or nothing when ACME_EMAIL is empty.
      ACME_EMAIL_OPTION: ${ACME_EMAIL:+email ${ACME_EMAIL}}
      GOMEMLIMIT: 28MiB
    mem_limit: &caddy-mem 40m
    memswap_limit: *caddy-mem
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    <<: *app
    environment:
      <<: *app-env
      # Only Caddy can reach the API, so trust its X-Forwarded-For header.
      FORWARDED_ALLOW_IPS: "*"
      WEB_CONCURRENCY: "1"
    # torch, the embedder and the reranker. Up to 512 MB more may go to swap:
    # about 150 MB is libraries sentence-transformers imports and never uses
    # again (scikit-learn, SciPy, SymPy), the right thing to page out.
    mem_limit: 600m
    memswap_limit: 1112m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First boot downloads the models before the app answers.
      start_period: 180s

  worker:
    <<: *app
    # -B runs Celery beat inside this single worker (stale-document sweep).
    # One pool process, replaced after 10 tasks: parsing and embedding leave
    # memory behind that Python does not hand back.
    command: celery -A src.workers.celery_app worker -B --concurrency=1 --max-tasks-per-child=10 --loglevel=info
    environment:
      <<: *app-env
      SKIP_MIGRATIONS: "true"
    # A pathological upload should take down the worker, not the VM. Swap as
    # for the API.
    mem_limit: 600m
    memswap_limit: 1112m
    # The image's HTTP healthcheck is for the API. The worker answers a ping
    # through the broker instead (about 1.5 s of CPU per check).
    healthcheck:
      test: ["CMD-SHELL", 'celery -A src.workers.celery_app inspect ping -d "celery@$$HOSTNAME" --timeout 10 >/dev/null']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
      start_interval: 5s
    depends_on:
      api:
        # The API container runs the database migrations.
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: docusage
      POSTGRES_USER: docusage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/demo-env.sh first}
    command:
      - postgres
      - -c
      - shared_buffers=24MB
      - -c
      - effective_cache_size=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=50
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum_max_workers=2
    mem_limit: &postgres-mem 96m
    memswap_limit: *postgres-mem
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docusage -d docusage"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/demo-env.sh first}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save 60 1 --maxmemory 16mb --maxmemory-policy noeviction --loglevel warning']
    mem_limit: &redis-mem 32m
    memswap_limit: *redis-mem
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.11.3
    restart: unless-stopped
    logging: *logging
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?run scripts/demo-env.sh first}
      QDRANT__TELEMETRY_DISABLED: "true"
      # Every workspace is its own collection, and every demo account gets
      # one (the sample documents). Defaults for new collections: a 1 MB
      # write-ahead log and one segment, about 3 MB per small collection
      # instead of 11 MB.
      QDRANT__STORAGE__WAL__WAL_CAPACITY_MB: "1"
      QDRANT__STORAGE__OPTIMIZERS__DEFAULT_SEGMENT_NUMBER: "1"
    # Grows with accounts (about 3 MB each) and documents. Collections nobody
    # is searching can go to swap (deploy/README.md, Memory).
    mem_limit: 128m
    memswap_limit: 640m
    volumes:
      - qdrant-data:/qdrant/storage

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    logging: *logging
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/demo-env.sh first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/demo-env.sh first}
      GOMEMLIMIT: 48MiB
    mem_limit: &seaweedfs-mem 64m
    memswap_limit: *seaweedfs-mem
    entrypoint: ["/bin/sh", "/start.sh"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/start.sh:/start.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  caddy-data:
  caddy-config:
  hf-cache:
  pg-data:
  redis-data:
  qdrant-data:
  seaweedfs-data:
