user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"ip":"$remote_addr",'
        '"referrer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Performance ───────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;    # Allow large document uploads
    server_tokens off;           # Hide nginx version

    # ── Gzip ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Security headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Rate limiting zones ───────────────────────────────────
    # Auth endpoints: 10 req/min per IP (brute force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # API endpoints: 120 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
    # Upload endpoints: 5 req/min per IP
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/m;

    # ── Request ID ────────────────────────────────────────────
    map $http_x_request_id $request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    include /etc/nginx/conf.d/*.conf;
}
