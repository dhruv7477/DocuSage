# ════════════════════════════════════════════════════════════════
#  PrivateAI — Local Development Stack
#  Starts: FastAPI, PostgreSQL, Qdrant, Redis, MinIO, Ollama
# ════════════════════════════════════════════════════════════════

networks:
  privateai-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
  ollama_data:

services:

  # ── FastAPI Application ───────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: privateai-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio-bootstrap:
        # Bucket must exist before document uploads can succeed.
        condition: service_completed_successfully
      ollama-bootstrap:
        # Model must be pulled before chat / ingestion can call the LLM.
        condition: service_completed_successfully
    volumes:
      - ..:/src
    networks:
      - privateai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: privateai-worker
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      OLLAMA_BASE_URL: http://ollama:11434
      SKIP_MIGRATIONS: "true"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ..:/src
    networks:
      - privateai-net
    restart: unless-stopped
    healthcheck:
      disable: true
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: privateai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docusage}
      POSTGRES_USER: ${POSTGRES_USER:-docusage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - privateai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docusage_user} -d ${POSTGRES_DB:-docusage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector DB ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: privateai-qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - privateai-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: privateai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - privateai-net
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible object storage) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: privateai-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - privateai-net
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── Ollama (LLaMA + Embeddings) ───────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: privateai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - privateai-net
    restart: unless-stopped
    # Ollama keeps the 7B (~4.6 GB) + 1.5B router (~1.1 GB) resident, so it
    # needs ~7-8 GB. This cap only helps if the WSL2 VM itself has the RAM —
    # the default ~8 GB VM also hosts qdrant/minio/redis, so Ollama swaps and
    # generation crawls to <1 tok/s. Raise the VM in %UserProfile%\.wslconfig
    # ([wsl2] memory=11GB) then `wsl --shutdown` + restart Docker. With an
    # 11 GB VM this 9 GB cap leaves headroom for the other dep containers.
    mem_limit: 9g
    mem_reservation: 7g
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Loading the model on first run takes a while; don't flap unhealthy
      # (which would restart the container and unload the model) during it.
      start_period: 60s
    # GPU support (uncomment if NVIDIA GPU available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Ollama bootstrap: pulls the configured LLM model on first run ──
  # Runs once and exits successfully so `api` and `worker` can depend on
  # `service_completed_successfully`. Without this users had to remember
  # to manually `ollama pull <model>` and the very first chat request
  # would fail because the model wasn't downloaded.
  ollama-bootstrap:
    image: ollama/ollama:latest
    container_name: privateai-ollama-bootstrap
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - privateai-net
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      # Small model used by the Question Analyzer (intent router).
      ROUTER_MODEL: ${ROUTER_MODEL:-qwen2.5:1.5b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for MODEL in "$$LLM_MODEL" "$$ROUTER_MODEL"; do
          echo "Ensuring Ollama model '$$MODEL' is available..."
          if ! ollama list 2>/dev/null | awk '{print $$1}' | grep -Fxq "$$MODEL"; then
            echo "Pulling $$MODEL (this may take a while on first run)..."
            ollama pull "$$MODEL"
          else
            echo "Model $$MODEL already present."
          fi
        done
    restart: "no"

  # ── MinIO bootstrap: creates the application bucket on first run ──
  # Uses the official mc client image. Idempotent — re-runs are no-ops.
  minio-bootstrap:
    image: minio/mc:latest
    container_name: privateai-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - privateai-net
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-privateai-docs}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "Waiting for MinIO..."; sleep 1
        done
        if ! mc ls "local/$$MINIO_BUCKET" >/dev/null 2>&1; then
          echo "Creating bucket $$MINIO_BUCKET..."
          mc mb "local/$$MINIO_BUCKET"
        else
          echo "Bucket $$MINIO_BUCKET already exists."
        fi
    restart: "no"
