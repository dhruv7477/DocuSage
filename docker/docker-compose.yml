# ════════════════════════════════════════════════════════════════
#  DocuSage: local development stack
#  Starts: FastAPI, PostgreSQL, Qdrant, Redis, SeaweedFS (S3), Ollama
#  Published ports bind to 127.0.0.1 only. Do not use this file on a
#  public server; use docker-compose.demo.yml there.
# ════════════════════════════════════════════════════════════════

networks:
  docusage-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  seaweedfs_data:
  ollama_data:

services:

  # ── FastAPI Application ───────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docusage-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: seaweedfs:8333
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      seaweedfs:
        # The app creates the bucket on first use.
        condition: service_healthy
      ollama-bootstrap:
        # Model must be pulled before chat / ingestion can call the LLM.
        condition: service_completed_successfully
    volumes:
      - ..:/src
    networks:
      - docusage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: docusage-worker
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      S3_ENDPOINT: seaweedfs:8333
      OLLAMA_BASE_URL: http://ollama:11434
      SKIP_MIGRATIONS: "true"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ..:/src
    networks:
      - docusage-net
    restart: unless-stopped
    healthcheck:
      disable: true
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=2

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: docusage-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docusage}
      POSTGRES_USER: ${POSTGRES_USER:-docusage_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - docusage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docusage_user} -d ${POSTGRES_DB:-docusage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant Vector DB ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.20.2
    container_name: docusage-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - docusage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:8-alpine
    container_name: docusage-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - docusage-net
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SeaweedFS (S3-compatible object storage) ──────────────────
  # Replaces MinIO, which no longer publishes images. The app's
  # s3_compatible storage backend is a generic S3 client.
  # Host port 9000 keeps S3_ENDPOINT=localhost:9000 working for an app
  # running on the host. Credentials come from S3_ACCESS_KEY and
  # S3_SECRET_KEY (or the old MINIO_* names) in the environment.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    container_name: docusage-seaweedfs
    ports:
      - "127.0.0.1:9000:8333"   # S3 API
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ACCESS_KEY:-minioadmin}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_SECRET_KEY:-minioadmin}}
    entrypoint: ["/bin/sh", "/start.sh"]
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/start.sh:/start.sh:ro
    networks:
      - docusage-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Ollama (LLaMA + Embeddings) ───────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: docusage-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - docusage-net
    restart: unless-stopped
    # Ollama keeps the 7B (~4.6 GB) + 1.5B router (~1.1 GB) resident, so it
    # needs ~7-8 GB. This cap only helps if the WSL2 VM itself has the RAM —
    # the default ~8 GB VM also hosts qdrant/minio/redis, so Ollama swaps and
    # generation crawls to <1 tok/s. Raise the VM in %UserProfile%\.wslconfig
    # ([wsl2] memory=11GB) then `wsl --shutdown` + restart Docker. With an
    # 11 GB VM this 9 GB cap leaves headroom for the other dep containers.
    mem_limit: 9g
    mem_reservation: 7g
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Loading the model on first run takes a while; don't flap unhealthy
      # (which would restart the container and unload the model) during it.
      start_period: 60s
    # GPU support (uncomment if NVIDIA GPU available):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Ollama bootstrap: pulls the configured LLM model on first run ──
  # Runs once and exits successfully so `api` and `worker` can depend on
  # `service_completed_successfully`. Without this users had to remember
  # to manually `ollama pull <model>` and the very first chat request
  # would fail because the model wasn't downloaded.
  ollama-bootstrap:
    image: ollama/ollama:latest
    container_name: docusage-ollama-bootstrap
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - docusage-net
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
      # Small model used by the Question Analyzer (intent router).
      ROUTER_MODEL: ${ROUTER_MODEL:-qwen2.5:1.5b-instruct}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for MODEL in "$$LLM_MODEL" "$$ROUTER_MODEL"; do
          echo "Ensuring Ollama model '$$MODEL' is available..."
          if ! ollama list 2>/dev/null | awk '{print $$1}' | grep -Fxq "$$MODEL"; then
            echo "Pulling $$MODEL (this may take a while on first run)..."
            ollama pull "$$MODEL"
          else
            echo "Model $$MODEL already present."
          fi
        done
    restart: "no"
